name: Deploy demo lên GitHub Pages

# Tự động build + deploy mỗi lần push lên branch main (chỉ khi đổi file trong frontend/)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: # cho phép run thủ công từ tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static
        run: pnpm build
        env:
          # Đặt basePath nếu repo KHÔNG phải <username>.github.io.
          # Nếu repo tên `rtd-erp-demo` → uncomment 2 dòng dưới và đặt basePath: '/rtd-erp-demo' trong next.config.mjs.
          # NEXT_PUBLIC_BASE_PATH: /rtd-erp-demo
          NEXT_PUBLIC_USE_MOCK: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
