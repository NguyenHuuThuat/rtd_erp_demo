# RTD ERP Demo — Hạ tầng dev
# Bước 1: chỉ chạy infra (Postgres, Redis, Adminer, MailHog).
# Bước 2 sẽ thêm service `backend`, Bước 3 thêm `frontend`.
#
# Khởi động:  docker compose up -d
# Tắt:        docker compose down
# Reset DB:   docker compose down -v   (xóa volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: rtd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rtd_erp}
      # Bật multi-schema search_path để Prisma multiSchema hoạt động
      PGOPTIONS: "-c search_path=public,master_data,financial,inventory,manufacturing,farm,sales,procurement,events"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtd} -d ${POSTGRES_DB:-rtd_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rtd-net

  redis:
    image: redis:7-alpine
    container_name: rtd-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rtd-net

  # Adminer: UI duyệt Postgres (http://localhost:8080)
  adminer:
    image: adminer:4.8.1
    container_name: rtd-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - rtd-net

  # MailHog: bắt outbound email khi dev (UI: http://localhost:8025, SMTP: 1025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: rtd-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - rtd-net

volumes:
  postgres_data:
    name: rtd_postgres_data
  redis_data:
    name: rtd_redis_data

networks:
  rtd-net:
    name: rtd-net
    driver: bridge
