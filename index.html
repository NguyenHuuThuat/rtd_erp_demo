const AreaChart = ({ data, height = 240 }) => {
  const w = 600, h = height, pad = { l:40, r:10, t:10, b:30 };
  const maxY = Math.max(...data.flatMap(d => [d.revenue, d.expense])) * 1.1;
  const minY = 0;
  const xStep = (w - pad.l - pad.r) / (data.length - 1);
  const yScale = (v) => h - pad.b - ((v - minY) / (maxY - minY)) * (h - pad.t - pad.b);
  const xPos = (i) => pad.l + i * xStep;
  const path = (key) => data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xPos(i)} ${yScale(d[key])}`).join(' ');
  const areaPath = (key) => `${path(key)} L ${xPos(data.length - 1)} ${h - pad.b} L ${xPos(0)} ${h - pad.b} Z`;
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => minY + t * (maxY - minY));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height }}>
      <defs>
        <linearGradient id="grad-rev" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#16a34a" stopOpacity="0.3" />
          <stop offset="100%" stopColor="#16a34a" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="grad-exp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.2" />
          <stop offset="100%" stopColor="#f43f5e" stopOpacity="0" />
        </linearGradient>
      </defs>
      {yTicks.map((v, i) => (
        <g key={i}>
          <line x1={pad.l} y1={yScale(v)} x2={w - pad.r} y2={yScale(v)} stroke="#e2e8f0" strokeDasharray="3 3" />
          <text x={pad.l - 6} y={yScale(v) + 4} fontSize="10" fill="#94a3b8" textAnchor="end">{v.toFixed(0)}</text>
        </g>
      ))}
      {data.map((d, i) => (
        <text key={i} x={xPos(i)} y={h - 8} fontSize="11" fill="#94a3b8" textAnchor="middle">{d.month}</text>
      ))}
      <path d={areaPath('revenue')} fill="url(#grad-rev)" />
      <path d={areaPath('expense')} fill="url(#grad-exp)" />
      <path d={path('revenue')} fill="none" stroke="#16a34a" strokeWidth="2" />
      <path d={path('expense')} fill="none" stroke="#f43f5e" strokeWidth="2" />
      {data.map((d, i) => (
        <g key={i}>
          <circle cx={xPos(i)} cy={yScale(d.revenue)} r="3" fill="#16a34a" />
          <circle cx={xPos(i)} cy={yScale(d.expense)} r="3" fill="#f43f5e" />
        </g>
      ))}
    </svg>
  );
};

const PieDonut = ({ data, size = 180 }) => {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = size / 2 - 4, cx = size / 2, cy = size / 2;
  const innerR = r * 0.62;
  let cumAngle = -Math.PI / 2;
  const slices = data.map((d) => {
    const angle = (d.value / total) * Math.PI * 2;
    const start = cumAngle, end = cumAngle + angle;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
    const xi1 = cx + innerR * Math.cos(end), yi1 = cy + innerR * Math.sin(end);
    const xi2 = cx + innerR * Math.cos(start), yi2 = cy + innerR * Math.sin(start);
    const largeArc = angle > Math.PI ? 1 : 0;
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${xi1} ${yi1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${xi2} ${yi2} Z`;
    cumAngle = end;
    return { path, color: d.color, label: d.name };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} />)}
    </svg>
  );
};

const BarChart = ({ items, height = 200, maxLabel = '' }) => {
  const max = Math.max(...items.map(i => i.value));
  return (
    <div className="space-y-2.5" style={{ minHeight: height }}>

        <div key={i}>

          </div>
        </div>
      ))}
      {maxLabel && <div className="text-[10px] text-slate-400 mt-2">Max: {maxLabel}</div>}
    </div>
  );
};

const aiAnswer = (q) => {
  const lower = q.toLowerCase();
  if (/doanh thu|revenue/.test(lower)) {
    return 'Doanh thu T5/2026: **2.535.000.000 ₫** (+9.3% so với T4).\n\nCơ cấu theo cty con:\n- RTD Feed: ~7.8 tỷ\n- RTD Farm: ~3.2 tỷ\n- RTD Food: ~1.5 tỷ\n- RTD Vet + Logistics: ~0.6 tỷ';
  }
  if (/quá hạn|overdue|công nợ|nợ/.test(lower)) {
    return 'Có **3 hóa đơn AR** chưa thu hết, tổng dư nợ **1.955.000.000 ₫**.\n\nTop đại lý nợ:\n1. **ĐL Hưng Thịnh** — 1.84 tỷ (hạn mức 2 tỷ)\n2. **ĐL Minh Phú** — 115 triệu (đã trả 1 phần)\n3. **ĐL Tây Nguyên** — 75 triệu';
  }
  if (/duyệt|approval|chờ/.test(lower)) {
    return 'Có **3 yêu cầu** đang chờ duyệt, tổng **13.915 tỷ ₫**:\n- **AR-2026-05-008** · Mua 50 tấn ngô (1.2 tỷ) — chờ KT trưởng\n- **AR-2026-05-009** · HĐ bán cám 215tr — chờ KT trưởng\n- **AR-2026-05-007** · Ngân sách Q2 RTD Feed (12.5 tỷ) — chờ TGĐ';
  }
  if (/tiền mặt|tiền gửi|số dư|cash/.test(lower)) {
    return 'Số dư tại 07/05/2026:\n- **TK 111 (Tiền mặt)**: 850.000.000 ₫\n- **TK 112 (Tiền gửi NH)**: 4.200.000.000 ₫\n- **Tổng tiền**: 5.050.000.000 ₫';
  }
  if (/lợi nhuận|lnst|profit/.test(lower)) {
    return '**LNST lũy kế 5 tháng**: 1.884.000.000 ₫\n\n- Doanh thu: 13.135 tỷ\n- Giá vốn: 9.280 tỷ\n- LN gộp: 3.855 tỷ\n- CP bán hàng + QLDN: 1.500 tỷ\n- Thuế TNDN (20%): 471 triệu';
  }
  if (/help|trợ giúp|làm gì|hỏi gì/.test(lower)) {
    return 'Tôi trả lời được:\n- 💰 Doanh thu, lợi nhuận\n- 📑 Công nợ, hóa đơn quá hạn\n- ✅ Phê duyệt đang chờ\n- 🏦 Số dư tiền mặt/ngân hàng\n- 👥 Người dùng, vai trò';
  }
  return 'Mình chưa được train câu này trong demo. Thử hỏi: doanh thu / công nợ / duyệt / tiền mặt / lợi nhuận.\n\n💡 Phase tới sẽ tích hợp **Claude API** để trả lời mọi câu hỏi.';
};

const formatBubble = (text) => {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => p.startsWith('**') && p.endsWith('**') ? <strong key={i}>{p.slice(2, -2)}</strong> : <span key={i}>{p}</span>);
};

const AiAssistant = () => {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');

const buildTree = (orgs) => {
  const byParent = {};
  orgs.forEach(o => { (byParent[o.parentId] = byParent[o.parentId] || []).push(o); });
  const recurse = (pid) => (byParent[pid] || []).map(o => ({ ...o, children: recurse(o.id) }));
  return recurse(null);
};

const TYPE_LABEL = { GROUP:'Tập đoàn', COMPANY:'Công ty', BRANCH:'Chi nhánh' };

const OrgRow = ({ node, depth, expanded, toggle, onSelect }) => {
  const has = node.children.length > 0;
  const open = expanded[node.id];
  const variant = node.type === 'GROUP' ? 'success' : node.type === 'COMPANY' ? 'info' : 'neutral';
  const iconColor = node.type === 'GROUP' ? 'text-rtd-600' : node.type === 'COMPANY' ? 'text-blue-600' : 'text-slate-500';
  return (
    <>
      <div className={cn('flex items-center gap-2 px-3 py-2.5 rounded-lg hover:bg-slate-50', depth === 0 && 'bg-slate-50/50')} style={{paddingLeft: 12 + depth * 24}}>
        <button onClick={() => has && toggle(node.id)} className="w-5 flex justify-center" disabled={!has}>
          {has && <Icon name={open ? 'chevronDown' : 'chevronRight'} className="w-4 h-4 text-slate-500" />}
        </button>
        <Icon name="building" className={cn('w-4 h-4 shrink-0', iconColor)} />
        <button onClick={() => onSelect(node)} className={cn('font-medium hover:text-rtd-700 hover:underline', depth === 0 ? 'text-slate-900' : 'text-slate-700')}>{node.name}</button>
        <code className="text-xs text-slate-400 px-1.5 py-0.5 bg-slate-100 rounded">{node.code}</code>
        <StatusBadge variant={variant}>{TYPE_LABEL[node.type]}</StatusBadge>
        {node.taxCode && <span className="text-xs text-slate-400 hidden lg:inline">MST: {node.taxCode}</span>}
        {node.province && <span className="text-xs text-slate-400 hidden md:inline-flex items-center gap-1 ml-auto"><Icon name="mapPin" className="w-3 h-3" />{node.province}</span>}
      </div>
      {has && open && node.children.map(c => <OrgRow key={c.id} node={c} depth={depth + 1} expanded={expanded} toggle={toggle} onSelect={onSelect} />)}
    </>
  );
};

  const [detail, setDetail] = useState(null);
  const [createOpen, setCreateOpen] = useState(false);
  const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));

  const counts = {
    GROUP: orgs.filter(o => o.type === 'GROUP').length,
    COMPANY: orgs.filter(o => o.type === 'COMPANY').length,
    BRANCH: orgs.filter(o => o.type === 'BRANCH').length,

  return (
    <div>
      <PageTitle

          <button onClick={() => toast('Xuất Excel — đang xây')} className="inline-flex items-center gap-2 bg-white border border-slate-300 hover:border-rtd-400 hover:text-rtd-700 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm">Xuất Excel</button>

      <Modal open={createOpen} onClose={() => setCreateOpen(false)} title="Thêm đơn vị mới" size="lg">

            <div className="border-t border-slate-100 pt-4">

};

const StatPill = ({ label, value, variant }) => {
  const styles = { success:'border-rtd-200 bg-rtd-50 text-rtd-800', info:'border-blue-200 bg-blue-50 text-blue-800', neutral:'border-slate-200 bg-slate-50 text-slate-700', primary:'border-violet-200 bg-violet-50 text-violet-800' };
  return <div className={cn('rounded-xl border p-4', styles[variant])}><div className="text-xs font-medium opacity-80">{label}</div><div className="text-2xl font-bold mt-1 tabular-nums">{value}</div></div>;
};

const Field = ({ label, value, mono }) => (
  <div><div className="text-xs text-slate-500 mb-0.5">{label}</div><div className={cn('text-sm text-slate-800', mono && 'font-mono break-all')}>{value}</div></div>
);

const OrgForm = ({ onSubmit, onCancel, orgs, initial }) => {
  const [code, setCode] = useState(initial?.code || '');
  const [name, setName] = useState(initial?.name || '');
  const [type, setType] = useState(initial?.type || 'COMPANY');
  const [parentId, setParentId] = useState(initial?.parentId || '');
  const [taxCode, setTaxCode] = useState(initial?.taxCode || '');
  const [province, setProvince] = useState(initial?.province || 'Hà Nội');
  const [err, setErr] = useState('');

  const allowedParents = orgs.filter(o => type === 'COMPANY' ? o.type === 'GROUP' : type === 'BRANCH' ? o.type === 'COMPANY' : false);

  const submit = (e) => {
    e.preventDefault();
    if (!/^[A-Z0-9_-]+$/.test(code)) return setErr('Mã chỉ gồm chữ HOA, số, gạch');
    if (type !== 'GROUP' && !parentId) return setErr('Đơn vị này phải có tổ chức cha');
    onSubmit({ id: 'new-' + Date.now(), code, name, type, parentId: parentId || null, taxCode, province });
  };

  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Mã đơn vị *</label><input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} required placeholder="VD: RTD-FEED" className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rtd-500" /></div>
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Loại *</label>
          <select value={type} onChange={(e) => { setType(e.target.value); if (e.target.value === 'GROUP') setParentId(''); }} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="GROUP">Tập đoàn</option><option value="COMPANY">Công ty</option><option value="BRANCH">Chi nhánh</option>
          </select>
        </div>
      </div>
      <div><label className="block text-sm font-medium text-slate-700 mb-1">Tên đầy đủ *</label><input value={name} onChange={(e) => setName(e.target.value)} required className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
      {type !== 'GROUP' && (
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Trực thuộc *</label>
          <select value={parentId} onChange={(e) => setParentId(e.target.value)} required className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="">— Chọn —</option>
            {allowedParents.map(p => <option key={p.id} value={p.id}>{p.code} — {p.name}</option>)}
          </select>
        </div>
      )}
      <div className="grid grid-cols-2 gap-4">
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Mã số thuế</label><input value={taxCode} onChange={(e) => setTaxCode(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Tỉnh</label>
          <select value={province} onChange={(e) => setProvince(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            {PROVINCES.map(p => <option key={p}>{p}</option>)}
          </select>
        </div>
      </div>
      {err && <div className="rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">{err}</div>}
      <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg">Hủy</button>
        <button type="submit" className="px-4 py-2 text-sm font-medium bg-rtd-600 hover:bg-rtd-700 text-white rounded-lg">Tạo mới</button>
      </div>
    </form>
  );
};

const PERMISSIONS_BY_RESOURCE = {
  'master_data.organizations': ['read','write','delete'],
  'master_data.users': ['read','write','delete'],
  'master_data.partners': ['read','write'],
  'financial.journals': ['read','write','post'],
  'financial.invoices': ['read','write','approve'],
  'financial.payments': ['read','write'],
  'financial.budgets': ['read','write','approve'],
  'financial.reports': ['read','export'],
  'admin.audit_logs': ['read'],
  'admin.settings': ['read','write'],
};

const isGranted = (role, resource, action) => {
  if (role === 'SUPER_ADMIN') return true;
  if (role === 'ADMIN') return action !== 'delete';
  if (role === 'ACCOUNTANT') return resource.startsWith('financial.') || (resource.startsWith('master_data.') && action === 'read');
  if (role === 'MANAGER_FACTORY') return action === 'read' || action === 'approve';
  return action === 'read';
};

const RolesPage = ({ toast }) => {
  const [selected, setSelected] = useState('SUPER_ADMIN');
  const role = ROLES.find(r => r.code === selected);
  return (
    <div>
      <PageTitle title="Vai trò & Phân quyền" subtitle={`${ROLES.length} vai trò · ${Object.values(PERMISSIONS_BY_RESOURCE).flat().length} permissions`}
        actions={<button onClick={() => toast('Tạo role tùy chỉnh — đang xây')} className="inline-flex items-center gap-2 bg-rtd-600 hover:bg-rtd-700 text-white font-medium px-4 py-2 rounded-lg text-sm"><Icon name="plus" className="w-4 h-4" />Tạo vai trò mới</button>}
      />
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div className="lg:col-span-4">

            <div className="divide-y divide-slate-100">
              {ROLES.map(r => (
                <button key={r.code} onClick={() => setSelected(r.code)} className={cn('w-full text-left px-4 py-3 hover:bg-slate-50 flex items-start gap-3', selected === r.code && 'bg-rtd-50')}>
                  <Icon name="shield" className={cn('w-5 h-5 mt-0.5 shrink-0', selected === r.code ? 'text-rtd-600' : 'text-slate-400')} />
                  <div className="flex-1 min-w-0">
                    <div className="font-mono text-xs font-semibold text-slate-800">{r.code}</div>
                    <div className="text-sm text-slate-700 mt-0.5">{r.name}</div>
                    <div className="text-xs text-slate-500 mt-0.5 truncate">{r.description}</div>
                    <div className="flex gap-3 mt-1.5 text-xs text-slate-500">
                      <span><Icon name="users" className="w-3 h-3 inline" /> {r.userCount}</span>
                      <span><Icon name="check" className="w-3 h-3 inline" /> {r.permCount} quyền</span>
                    </div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
        <div className="lg:col-span-8">
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100 bg-slate-50">
              <h3 className="font-semibold text-slate-800">{role.name}</h3>
              <p className="text-xs text-slate-500 mt-0.5">{role.description}</p>
            </div>
            <div className="max-h-[600px] overflow-y-auto">
              {Object.entries(PERMISSIONS_BY_RESOURCE).map(([resource, actions]) => (
                <div key={resource} className="border-b border-slate-100">
                  <div className="px-5 py-2.5 bg-slate-50/50 font-mono text-xs text-slate-600">{resource}</div>
                  <div className="divide-y divide-slate-50">
                    {actions.map(action => {
                      const granted = isGranted(role.code, resource, action);
                      return (
                        <div key={action} className="px-5 py-2.5 flex items-center gap-3">
                          <input type="checkbox" checked={granted} disabled readOnly className="rounded text-rtd-600" />
                          <div className="flex-1 text-sm text-slate-700"><span className="font-mono text-xs text-slate-400 mr-2">{action}</span></div>
                          {granted && <StatusBadge variant="success">Có quyền</StatusBadge>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

      <PageTitle title="Cài đặt hệ thống" subtitle="14 cấu hình × 5 nhóm · Áp dụng cho toàn tập đoàn" />
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div className="lg:col-span-3">
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            {tabs.map(t => (
              <button key={t.key} onClick={() => setTab(t.key)} className={cn('w-full flex items-center gap-3 px-4 py-3 text-sm border-l-2', tab === t.key ? 'border-l-rtd-600 bg-rtd-50 text-rtd-700 font-medium' : 'border-l-transparent hover:bg-slate-50 text-slate-700')}>
                <Icon name={t.icon} className="w-4 h-4" /><span className="flex-1 text-left">{t.label}</span><span className="text-xs text-slate-400">{settings[t.key].length}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="lg:col-span-9">
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 bg-slate-50/50 font-semibold text-slate-800 flex items-center gap-2">
              <Icon name="settings" className="w-4 h-4" />{tabs.find(t => t.key === tab).label}
            </div>
            <div className="divide-y divide-slate-100">
              {settings[tab].map(s => (
                <div key={s.k} className="px-6 py-4 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                  <div className="md:col-span-1">
                    <div className="text-sm font-medium text-slate-800">{s.l}</div>
                    <code className="text-[10px] text-slate-400 mt-1 inline-block">{s.k}</code>
                  </div>
                  <div className="md:col-span-2">
                    {s.t === 'toggle' ? (
                      <label className="inline-flex items-center cursor-pointer">
                        <input type="checkbox" defaultChecked={s.v === 'true'} className="sr-only peer" onChange={() => toast('Đã lưu (demo)')} />
                        <div className="relative w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:border after:border-slate-300 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rtd-600"></div>
                      </label>
                    ) : s.t === 'select' ? (
                      <select defaultValue={s.v} className="rounded-lg border border-slate-300 px-3 py-2 text-sm max-w-xs">{s.options.map(o => <option key={o}>{o}</option>)}</select>

              ))}

          </div>
        </div>

    </div>

};

const APPR_TYPE_ICON = { PURCHASE_ORDER:'file', INVOICE:'receipt', BUDGET:'target', JOURNAL:'scroll' };
const APPR_TYPE_LABEL = { PURCHASE_ORDER:'Đơn mua', INVOICE:'Hóa đơn', BUDGET:'Ngân sách', JOURNAL:'Bút toán' };

const ApprovalsPage = ({ approvals, decide, toast }) => {
  const [detail, setDetail] = useState(null);
  const [comment, setComment] = useState('');
  const [filter, setFilter] = useState('PENDING');

  const filtered = approvals.filter(a => filter === 'all' || a.status === filter);
  const pending = approvals.filter(a => a.status === 'PENDING');
  const approved = approvals.filter(a => a.status === 'APPROVED');
  const rejected = approvals.filter(a => a.status === 'REJECTED');

  const onDecide = (result) => {
    if (result === 'REJECTED' && !comment.trim()) {
      toast('Phải có lý do khi từ chối');
      return;
    }
    decide(detail.id, result, comment);
    toast(result === 'APPROVED' ? `Đã duyệt ${detail.code}` : `Đã từ chối ${detail.code}`);
    setDetail(null);
    setComment('');
  };

  return (
    <div>
      <PageTitle title="Phê duyệt" subtitle={`${pending.length} yêu cầu đang chờ · Tổng giá trị ${formatVND(pending.reduce((s,a) => s + a.amount, 0))}`} />

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <KpiBox label="Đang chờ" value={pending.length} variant="warning" icon="checkCircle" />
        <KpiBox label="Đã duyệt (5 ngày)" value={approved.length} variant="success" icon="check" />
        <KpiBox label="Bị từ chối" value={rejected.length} variant="danger" icon="x" />
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div className="p-3 border-b border-slate-100 flex items-center gap-3">
          <Icon name="filter" className="w-4 h-4 text-slate-400" />
          <div className="flex bg-slate-100 rounded-lg p-0.5 text-xs">
            {[['PENDING','Đang chờ duyệt'],['all','Tất cả']].map(([k,l]) => (
              <button key={k} onClick={() => setFilter(k)} className={cn('px-3 py-1 rounded', filter === k ? 'bg-white text-slate-800 shadow-sm font-medium' : 'text-slate-500')}>{l}</button>
            ))}
          </div>
        </div>
        <div className="divide-y divide-slate-100">
          {filtered.map(a => (
            <button key={a.id} onClick={() => setDetail(a)} className="w-full text-left px-5 py-4 hover:bg-slate-50 flex items-start gap-4">
              <div className={cn('w-10 h-10 rounded-lg flex items-center justify-center shrink-0', a.status === 'PENDING' ? 'bg-amber-100 text-amber-700' : a.status === 'APPROVED' ? 'bg-rtd-100 text-rtd-700' : 'bg-rose-100 text-rose-700')}>
                <Icon name={APPR_TYPE_ICON[a.type]} className="w-5 h-5" />
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-mono text-xs text-slate-500">{a.code}</span>
                  <StatusBadge variant="neutral">{APPR_TYPE_LABEL[a.type]}</StatusBadge>
                  <StatusBadge variant={a.status === 'PENDING' ? 'warning' : a.status === 'APPROVED' ? 'success' : 'danger'} dot={a.status === 'PENDING'}>
                    {a.status === 'PENDING' ? 'Đang chờ' : a.status === 'APPROVED' ? 'Đã duyệt' : 'Từ chối'}
                  </StatusBadge>
                </div>
                <div className="font-medium text-slate-800 mt-1">{a.title}</div>
                <div className="text-xs text-slate-500 mt-1">YC: <strong>{a.requester}</strong> · {a.submittedAt}{a.status === 'PENDING' && <> · <span className="text-amber-700">Bước {a.currentStep}/{a.totalSteps}: {a.currentApprover}</span></>}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="text-lg font-bold text-slate-900 tabular-nums">{formatVND(a.amount)}</div>
              </div>
            </button>
          ))}
        </div>
      </div>

      <Drawer open={!!detail} onClose={() => { setDetail(null); setComment(''); }} title={detail?.code || ''} subtitle={detail?.type ? APPR_TYPE_LABEL[detail.type] : ''}
        footer={detail?.status === 'PENDING' && (
          <div className="space-y-3">
            <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Ghi chú / lý do (bắt buộc khi từ chối)…" rows={2} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg" />
            <div className="flex justify-end gap-2">
              <button onClick={() => onDecide('REJECTED')} className="inline-flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2 rounded-lg text-sm"><Icon name="x" className="w-4 h-4" />Từ chối</button>
              <button onClick={() => onDecide('APPROVED')} className="inline-flex items-center gap-2 bg-rtd-600 hover:bg-rtd-700 text-white font-medium px-4 py-2 rounded-lg text-sm"><Icon name="check" className="w-4 h-4" />Duyệt</button>
            </div>
          </div>
        )}
      >
        {detail && (
          <div className="p-6 space-y-6">
            <div>
              <div className="text-2xl font-bold text-slate-900">{formatVND(detail.amount)}</div>
              <div className="text-sm text-slate-700 mt-1">{detail.title}</div>
            </div>
            <div className="border-t border-slate-100 pt-4">
              <div className="text-xs font-semibold text-slate-500 uppercase mb-3">Người yêu cầu</div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-rtd-100 text-rtd-700 flex items-center justify-center font-semibold">{detail.requester.charAt(0)}</div>
                <div>
                  <div className="font-medium text-slate-800">{detail.requester}</div>
                  <div className="text-xs text-slate-500">{detail.requesterEmail}</div>
                  <div className="text-xs text-slate-400">Gửi lúc {detail.submittedAt}</div>
                </div>
              </div>
            </div>
            <div className="border-t border-slate-100 pt-4">
              <div className="text-xs font-semibold text-slate-500 uppercase mb-3">Lộ trình duyệt</div>
              <div className="space-y-3">
                {detail.history.map(h => (
                  <div key={h.step} className="flex gap-3">
                    <div className="flex flex-col items-center">
                      <div className={cn('w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0',
                        h.result === 'APPROVED' ? 'bg-rtd-100 text-rtd-700' :
                        h.result === 'REJECTED' ? 'bg-rose-100 text-rose-700' :
                        h.step === detail.currentStep && detail.status === 'PENDING' ? 'bg-amber-100 text-amber-700 ring-2 ring-amber-300' :
                        'bg-slate-100 text-slate-400')}>
                        {h.result === 'APPROVED' ? <Icon name="check" className="w-4 h-4" /> : h.result === 'REJECTED' ? <Icon name="x" className="w-4 h-4" /> : h.step}
                      </div>
                      {h.step < detail.history.length && <div className="w-0.5 flex-1 bg-slate-200 my-1 min-h-[20px]" />}
                    </div>
                    <div className="flex-1 pb-3">
                      <div className="font-medium text-slate-800 text-sm">{h.name}</div>
                      <div className="text-xs text-slate-500">{h.approver}</div>
                      {h.at && <div className="text-xs text-slate-400 mt-0.5">{h.at}</div>}
                      {h.comment && <div className="text-xs text-slate-600 mt-1 bg-slate-50 px-2 py-1 rounded italic">"{h.comment}"</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </Drawer>
    </div>
  );
};

const KpiBox = ({ label, value, variant, icon }) => {
  const styles = {
    warning:'bg-amber-50 border-amber-200 text-amber-900',
    success:'bg-rtd-50 border-rtd-200 text-rtd-900',
    danger:'bg-rose-50 border-rose-200 text-rose-900',
  };
  return (
    <div className={cn('rounded-xl border-2 p-4 flex items-center justify-between', styles[variant])}>
      <div>
        <div className="text-xs font-medium opacity-80">{label}</div>
        <div className="text-3xl font-bold mt-1 tabular-nums">{value}</div>
      </div>
      <Icon name={icon} className="w-5 h-5 opacity-60" />
    </div>
  );
};

const REF_LABEL = { PURCHASE_INVOICE:'HĐ mua', SALES_INVOICE:'HĐ bán', PAYMENT_RECEIPT:'Phiếu thu', PAYMENT_DISBURSEMENT:'Phiếu chi', MANUAL:'Thủ công' };

const JournalsPage = ({ journals, addJournal, toast }) => {
  const [createOpen, setCreateOpen] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('all');

  const filtered = journals.filter(j => {
    if (search && !`${j.code} ${j.description}`.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterStatus !== 'all' && j.status !== filterStatus) return false;
    return true;
  });
  const totalDebit = filtered.reduce((s, j) => s + j.totalDebit, 0);
  const totalCredit = filtered.reduce((s, j) => s + j.totalCredit, 0);

  return (
    <div>
      <PageTitle title="Sổ nhật ký" subtitle={`${journals.length} bút toán · Cân đối Nợ = Có`}
        actions={<button onClick={() => setCreateOpen(true)} className="inline-flex items-center gap-2 bg-rtd-600 hover:bg-rtd-700 text-white font-medium px-4 py-2 rounded-lg text-sm"><Icon name="plus" className="w-4 h-4" />Tạo bút toán</button>}
      />
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div className="p-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
          <div className="relative flex-1 min-w-[240px] max-w-md">
            <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Tìm theo mã hoặc diễn giải…" className="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 border border-transparent rounded-lg focus:outline-none focus:bg-white focus:border-slate-300" />
          </div>
          <div className="flex bg-slate-100 rounded-lg p-0.5 text-xs">
            {[['all','Tất cả'],['POSTED','Đã ghi sổ'],['DRAFT','Nháp']].map(([k,l]) => (
              <button key={k} onClick={() => setFilterStatus(k)} className={cn('px-3 py-1 rounded', filterStatus === k ? 'bg-white text-slate-800 shadow-sm font-medium' : 'text-slate-500')}>{l}</button>
            ))}
          </div>
          <div className="ml-auto text-xs text-slate-500">Hiển thị <strong>{filtered.length}</strong>/{journals.length}</div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-xs text-slate-500 uppercase">
              <tr>
                <th className="text-left font-semibold px-4 py-3">Mã</th>
                <th className="text-left font-semibold px-4 py-3 w-28">Ngày</th>
                <th className="text-left font-semibold px-4 py-3">Diễn giải</th>
                <th className="text-left font-semibold px-4 py-3 w-28">Loại</th>
                <th className="text-right font-semibold px-4 py-3 w-40">Tổng nợ</th>
                <th className="text-right font-semibold px-4 py-3 w-40">Tổng có</th>
                <th className="text-center font-semibold px-4 py-3 w-32">Trạng thái</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filtered.map(j => (
                <tr key={j.id} className="hover:bg-slate-50">
                  <td className="px-4 py-3 font-mono text-xs text-slate-700">{j.code}</td>
                  <td className="px-4 py-3 text-slate-500 text-xs">{j.date}</td>
                  <td className="px-4 py-3 text-slate-700">{j.description}</td>
                  <td className="px-4 py-3"><span className="text-xs text-slate-600 bg-slate-100 px-2 py-0.5 rounded">{REF_LABEL[j.refType]}</span></td>
                  <td className="px-4 py-3 text-right tabular-nums text-slate-800">{formatVND(j.totalDebit)}</td>
                  <td className="px-4 py-3 text-right tabular-nums text-slate-800">{formatVND(j.totalCredit)}</td>
                  <td className="px-4 py-3 text-center"><StatusBadge variant={j.status === 'POSTED' ? 'success' : 'warning'}>{j.status === 'POSTED' ? 'Đã ghi sổ' : 'Nháp'}</StatusBadge></td>
                </tr>
              ))}
            </tbody>
            <tfoot className="bg-slate-50 font-semibold">
              <tr>
                <td colSpan={4} className="px-4 py-3 text-slate-600">Tổng cộng</td>
                <td className="px-4 py-3 text-right tabular-nums">{formatVND(totalDebit)}</td>
                <td className="px-4 py-3 text-right tabular-nums">{formatVND(totalCredit)}</td>
                <td className="px-4 py-3 text-center text-rtd-700 text-xs">{Math.abs(totalDebit - totalCredit) < 0.01 ? '✓ Cân đối' : '⚠ Lệch'}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
      <Modal open={createOpen} onClose={() => setCreateOpen(false)} title="Tạo bút toán mới" description="Nhập tối thiểu 2 dòng (1 Nợ, 1 Có) — hệ thống tự kiểm tra cân đối" size="2xl">
        <JournalForm onSubmit={(j) => { addJournal(j); setCreateOpen(false); toast(`Đã tạo bút toán ${j.code}`); }} onCancel={() => setCreateOpen(false)} />
      </Modal>
    </div>
  );
};

const JournalForm = ({ onSubmit, onCancel }) => {
  const today = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(today);
  const [refType, setRefType] = useState('MANUAL');
  const [description, setDescription] = useState('');
  const [lines, setLines] = useState([
    { id:1, account:'', desc:'', debit:'', credit:'' },
    { id:2, account:'', desc:'', debit:'', credit:'' },
  ]);

  const totalDebit = lines.reduce((s, l) => s + (parseFloat(l.debit) || 0), 0);
  const totalCredit = lines.reduce((s, l) => s + (parseFloat(l.credit) || 0), 0);
  const balance = totalDebit - totalCredit;
  const balanced = Math.abs(balance) < 0.001 && totalDebit > 0;

  const addLine = () => setLines(l => [...l, { id:Date.now(), account:'', desc:'', debit:'', credit:'' }]);
  const removeLine = (id) => { if (lines.length > 2) setLines(l => l.filter(x => x.id !== id)); };
  const updateLine = (id, patch) => setLines(l => l.map(x => {
    if (x.id !== id) return x;
    const n = { ...x, ...patch };
    if (patch.debit !== undefined && parseFloat(patch.debit) > 0) n.credit = '';
    if (patch.credit !== undefined && parseFloat(patch.credit) > 0) n.debit = '';
    return n;
  }));

  const submit = (e) => {
    e.preventDefault();
    if (!balanced) return;
    if (!description.trim()) return;
    if (lines.some(l => !l.account)) return;
    const code = `JV-${date.replace(/-/g,'').slice(2)}-${String(Date.now()).slice(-3)}`;
    onSubmit({ id:'new-' + Date.now(), code, date: date.split('-').reverse().join('/'), description, refType, totalDebit, totalCredit, status:'DRAFT' });
  };

  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-3 gap-4">
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Ngày *</label><input type="date" value={date} onChange={(e) => setDate(e.target.value)} required className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Loại</label>
          <select value={refType} onChange={(e) => setRefType(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            {Object.entries(REF_LABEL).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </div>
        <div><label className="block text-sm font-medium text-slate-700 mb-1">Mã (tự sinh)</label><input value="JV-AUTO" disabled className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-slate-50 text-slate-400" /></div>
      </div>
      <div><label className="block text-sm font-medium text-slate-700 mb-1">Diễn giải *</label><input value={description} onChange={(e) => setDescription(e.target.value)} required placeholder="VD: Mua nguyên liệu ngô vàng nhập kho NM Hà Nam" className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="text-sm font-medium text-slate-700">Chi tiết bút toán</label>
          <button type="button" onClick={addLine} className="text-sm text-rtd-600 hover:text-rtd-700 inline-flex items-center gap-1"><Icon name="plus" className="w-3.5 h-3.5" />Thêm dòng</button>
        </div>
        <div className="border border-slate-200 rounded-lg overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-xs text-slate-500 uppercase">
              <tr><th className="text-left font-semibold px-3 py-2">Tài khoản</th><th className="text-left font-semibold px-3 py-2">Diễn giải</th><th className="text-right font-semibold px-3 py-2 w-32">Nợ</th><th className="text-right font-semibold px-3 py-2 w-32">Có</th><th className="w-10"></th></tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {lines.map(line => (
                <tr key={line.id}>
                  <td className="px-2 py-1.5"><select value={line.account} onChange={(e) => updateLine(line.id, { account:e.target.value })} className="w-full px-2 py-1 text-sm border border-slate-200 rounded"><option value="">— Chọn TK —</option>{ACCOUNTS.map(a => <option key={a.code} value={a.code}>{a.code} — {a.name}</option>)}</select></td>
                  <td className="px-2 py-1.5"><input value={line.desc} onChange={(e) => updateLine(line.id, { desc:e.target.value })} placeholder="Ghi chú dòng" className="w-full px-2 py-1 text-sm border border-slate-200 rounded" /></td>
                  <td className="px-2 py-1.5"><input type="number" value={line.debit} onChange={(e) => updateLine(line.id, { debit:e.target.value })} placeholder="0" className="w-full px-2 py-1 text-sm border border-slate-200 rounded text-right tabular-nums" /></td>
                  <td className="px-2 py-1.5"><input type="number" value={line.credit} onChange={(e) => updateLine(line.id, { credit:e.target.value })} placeholder="0" className="w-full px-2 py-1 text-sm border border-slate-200 rounded text-right tabular-nums" /></td>
                  <td className="px-1"><button type="button" onClick={() => removeLine(line.id)} className="p-1 rounded hover:bg-rose-50 text-slate-400 hover:text-rose-600"><Icon name="trash" className="w-3.5 h-3.5" /></button></td>
                </tr>
              ))}
            </tbody>
            <tfoot className="bg-slate-50 font-semibold text-sm">
              <tr><td colSpan={2} className="px-3 py-2 text-right text-slate-600">Tổng</td><td className="px-3 py-2 text-right tabular-nums">{formatNumber(totalDebit)}</td><td className="px-3 py-2 text-right tabular-nums">{formatNumber(totalCredit)}</td><td></td></tr>
            </tfoot>
          </table>
        </div>
        <div className="mt-2">
          {balanced ? <div className="text-xs text-rtd-700 bg-rtd-50 rounded px-3 py-1.5 inline-block">✓ Cân đối: Nợ = Có = {formatVND(totalDebit)}</div>

const ChartOfAccountsPage = () => {
  const [expanded, setExpanded] = useState(() => Object.fromEntries(COA.filter(a => !a.isLeaf).map(a => [a.code, true])));
  const toggle = (c) => setExpanded(e => ({ ...e, [c]: !e[c] }));
  const tree = useMemo(() => {
    const byParent = {};
    COA.forEach(a => { (byParent[a.parent] = byParent[a.parent] || []).push(a); });
    const recurse = (p) => (byParent[p] || []).map(a => ({ ...a, children: recurse(a.code) }));
    return recurse(null);
  }, []);

  const stats = ['ASSET','LIABILITY','EQUITY','REVENUE','EXPENSE'].map(t => ({
    type: t, label: ACC_TYPE[t][1],
    total: COA.filter(a => a.type === t && a.isLeaf).reduce((s, a) => s + a.balance, 0),
  }));

  const renderRow = (node, depth) => {
    const has = node.children.length > 0;
    const open = expanded[node.code];
    const [variant] = ACC_TYPE[node.type];
    return (
      <React.Fragment key={node.code}>
        <tr className={cn('hover:bg-slate-50', depth === 0 && 'bg-slate-50/50 font-medium')}>
          <td className="px-4 py-2.5">
            <div className="flex items-center gap-2" style={{paddingLeft: depth * 20}}>
              <button onClick={() => has && toggle(node.code)} className="w-4">{has && <Icon name={open ? 'chevronDown' : 'chevronRight'} className="w-3.5 h-3.5 text-slate-400" />}</button>
              <span className="font-mono text-xs text-slate-500 w-10">{node.code}</span>
              <span className="text-slate-800">{node.name}</span>
              {!node.isLeaf && <span className="text-[10px] text-slate-400 italic">(tổng hợp)</span>}
            </div>
          </td>
          <td className="px-4 py-2.5"><StatusBadge variant={variant}>{ACC_TYPE[node.type][1]}</StatusBadge></td>
          <td className="px-4 py-2.5 text-right tabular-nums"><span className={cn(node.balance < 0 && 'text-rose-600')}>{formatVND(node.balance)}</span></td>
        </tr>
        {has && open && node.children.map(c => renderRow(c, depth + 1))}
      </React.Fragment>
    );
  };

  return (
    <div>
      <PageTitle title="Hệ thống tài khoản" subtitle={`${COA.length} tài khoản · Theo TT200 (rút gọn)`} />
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
        {stats.map(s => {
          const [variant] = ACC_TYPE[s.type];
          const styles = { success:'border-rtd-200 bg-rtd-50', warning:'border-amber-200 bg-amber-50', primary:'border-violet-200 bg-violet-50', info:'border-blue-200 bg-blue-50', danger:'border-rose-200 bg-rose-50' };
          return (
            <div key={s.type} className={cn('rounded-lg border p-3', styles[variant])}>
              <div className="text-xs text-slate-600 font-medium">{s.label}</div>
              <div className="text-base font-bold text-slate-900 mt-0.5 tabular-nums">{formatVND(s.total)}</div>
            </div>
          );
        })}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th className="text-left font-semibold px-4 py-3">Mã & Tên</th><th className="text-left font-semibold px-4 py-3 w-40">Loại</th><th className="text-right font-semibold px-4 py-3 w-44">Số dư</th></tr></thead>
          <tbody className="divide-y divide-slate-100">{tree.map(n => renderRow(n, 0))}</tbody>
        </table>
      </div>
    </div>
  );
};

const BudgetsPage = () => {
  const LINES = [
    { acc:'511', name:'Doanh thu BH', cc:'NM-HN', plan:7000000000, actual:4855000000 },
    { acc:'511', name:'Doanh thu BH', cc:'NM-BN', plan:5200000000, actual:3410000000 },

    <div>

        <SumCard label="Kế hoạch Q2" value={formatVND(totals.plan)} hint="Theo dự toán" accent="blue" />

        <SumCard label="Chênh lệch" value={formatVND(Math.abs(totals.actual - totals.plan))} hint={totals.actual > totals.plan ? 'Vượt ngân sách' : 'Trong ngân sách'} accent={totals.actual > totals.plan ? 'rose' : 'green'} />
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th className="text-left font-semibold px-4 py-3">TK</th><th className="text-left font-semibold px-4 py-3">Tên</th><th className="text-left font-semibold px-4 py-3">Cost Center</th><th className="text-right font-semibold px-4 py-3">Kế hoạch</th><th className="text-right font-semibold px-4 py-3">Thực tế</th><th className="text-right font-semibold px-4 py-3">Chênh lệch</th><th className="text-center font-semibold px-4 py-3">Trạng thái</th></tr></thead>
          <tbody className="divide-y divide-slate-100">
            {LINES.map((l, i) => {
              const variance = l.actual - l.plan;
              const variancePct = (variance / l.plan) * 100;
              return (
                <tr key={i} className="hover:bg-slate-50">
                  <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.acc}</td>
                  <td className="px-4 py-3 text-slate-700">{l.name}</td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-600">{l.cc}</td>
                  <td className="px-4 py-3 text-right tabular-nums text-slate-700">{formatVND(l.plan)}</td>
                  <td className="px-4 py-3 text-right tabular-nums font-medium text-slate-900">{formatVND(l.actual)}</td>
                  <td className="px-4 py-3 text-right tabular-nums"><span className={variance > 0 ? 'text-rose-600' : 'text-rtd-700'}>{variance > 0 ? '+' : ''}{formatVND(variance)}</span></td>
                  <td className="px-4 py-3 text-center">{Math.abs(variancePct) < 5 ? <StatusBadge variant="success">Đúng KH</StatusBadge> : variance > 0 ? <StatusBadge variant="danger">Vượt {variancePct.toFixed(1)}%</StatusBadge> : <StatusBadge variant="info">Tiết kiệm {Math.abs(variancePct).toFixed(1)}%</StatusBadge>}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const ToastContainer = ({ toasts }) => (
  <div className="fixed top-4 right-4 z-[60] space-y-2 pointer-events-none">
    {toasts.map(t => (
      <div key={t.id} className="bg-white rounded-lg shadow-xl border border-slate-200 px-4 py-2.5 text-sm flex items-center gap-2 min-w-[260px] animate-in pointer-events-auto">
        <Icon name={t.type === 'error' ? 'x' : 'check'} className={cn('w-4 h-4', t.type === 'error' ? 'text-rose-600' : 'text-rtd-600')} />
        <span className="text-slate-700">{t.msg}</span>
      </div>
    ))}
  </div>
);

// ============================================================
// MAIN APP
// ============================================================

const App = () => {
  const [authed, setAuthed] = useState(false);
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [orgs, setOrgs] = useState(ORGS);
  const [users] = useState(USERS);
  const [journals, setJournals] = useState(INITIAL_JOURNALS);
  const [approvals, setApprovals] = useState(APPROVALS);
  const [notifications, setNotifications] = useState(NOTIFICATIONS);
  const [toasts, setToasts] = useState([]);

  const toast = (msg, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };

  const onLogin = (u) => { setAuthed(true); setUser(u); setPage('dashboard'); toast(`Chào mừng, ${u.fullName}!`); };
  const onLogout = () => { setAuthed(false); setUser(null); toast('Đã đăng xuất'); };
  const addOrg = (o) => setOrgs(prev => [...prev, o]);
  const addJournal = (j) => setJournals(prev => [j, ...prev]);
  const decideApproval = (id, result, comment) => {
    setApprovals(prev => prev.map(a => a.id === id ? {
      ...a,
      status: result,
      history: a.history.map(h => h.step === a.currentStep ? { ...h, result, at: new Date().toLocaleString('vi-VN'), comment } : h),
    } : a));
  };
  const markAllRead = () => setNotifications(prev => prev.map(n => ({ ...n, read: true })));
  const startTour = () => toast('Tour interactive đang xây — bấm sidebar để khám phá 8 trang', 'info');

  if (!authed) {
    return <>
      <LoginPage onLogin={onLogin} toast={toast} />
      <ToastContainer toasts={toasts} />
    </>;
  }

  let content;
  switch (page) {
    case 'dashboard': content = <Dashboard user={user} setPage={setPage} />; break;
    case 'orgs': content = <OrgsPage orgs={orgs} addOrg={addOrg} toast={toast} />; break;
    case 'users': content = <UsersPage users={users} toast={toast} />; break;
    case 'roles': content = <RolesPage toast={toast} />; break;
    case 'partners': content = <PartnersPage toast={toast} />; break;
    case 'approvals': content = <ApprovalsPage approvals={approvals} decide={decideApproval} toast={toast} />; break;
    case 'audit': content = <AuditPage />; break;
    case 'settings': content = <SettingsPage toast={toast} />; break;
    case 'financial': content = <FinancialOverview setPage={setPage} />; break;
    case 'coa': content = <ChartOfAccountsPage />; break;
    case 'journals': content = <JournalsPage journals={journals} addJournal={addJournal} toast={toast} />; break;
    case 'invoices': content = <InvoicesPage toast={toast} />; break;
    case 'payments': content = <PaymentsPage toast={toast} />; break;
    case 'costcenters': content = <CostCentersPage />; break;
    case 'budgets': content = <BudgetsPage />; break;
    case 'reports': content = <ReportsPage toast={toast} />; break;
    default: content = <Dashboard user={user} setPage={setPage} />;
  }

  return (
    <>
      <div className="flex flex-col min-h-screen">
        <DemoBanner onStartTour={startTour} />
        <div className="flex flex-1">
          <Sidebar currentPage={page} setPage={setPage} />
          <div className="flex-1 flex flex-col min-w-0">
            <Topbar user={user} onLogout={onLogout} notifications={notifications} markAllRead={markAllRead} toast={toast} />
            <main className="flex-1 p-6 max-w-screen-2xl w-full mx-auto">{content}</main>
          </div>
        </div>
      </div>
      <AiAssistant />
      <ToastContainer toasts={toasts} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
